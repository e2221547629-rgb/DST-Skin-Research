name: Lua diagnostics
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  lua51:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install --yes lua5.1
      - name: Syntax and mock runtime
        run: |
          find mod tests -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          lua5.1 tests/mock_runtime.lua
      - name: Guardrails and tool syntax
        run: |
          python3 tools/check_guardrails.py
          python3 -m compileall -q tools
      - name: Source audit boundary
        run: echo 'Proprietary game scripts and real DST sessions are intentionally not part of this CI job.'
